[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
cr-core = { path = "crates/cr-core" }
cr-io = { path = "crates/cr-io" }
cr-image = { path = "crates/cr-image" }
cr-engine = { path = "crates/cr-engine" }
cr-scrape = { path = "crates/cr-scrape" }
cr-ui = { path = "crates/cr-ui" }
cr-cli = { path = "crates/cr-cli" }
serde = { version = "1", features = ["derive"] }
quick-xml = { version = "0.37", features = ["serialize"] }
thiserror = "2"
anyhow = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate", "deflate64"] }
tar = "0.4"
sha1 = "0.10"
xattr = "1"
image = { version = "0.25", default-features = false, features = ["png", "gif", "tiff", "bmp", "webp"] }
zune-jpeg = "0.4"
zune-core = "0.4"
jxl-oxide = "0.8"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
