[package]
name = "cr-engine"
version.workspace = true
edition.workspace = true

[dependencies]
cr-core = { path = "../cr-core" }
cr-io = { path = "../cr-io" }
cr-image = { path = "../cr-image" }
zip.workspace = true
chrono.workspace = true
fancy-regex = "0.14"
notify = "6"

[lints]
workspace = true

[dev-dependencies]
# MUST be the workspace entry, not a bare `zip = "2"`. A bare entry
# takes zip's DEFAULT features, which include the "deflate"
# meta-feature and so drag zopfli back in (ADR-041). It also masks
# feature breakage: dev-dependencies are feature-unified into
# `cargo test --workspace`, so a workspace test run compiled while
# `cargo build -p cr-app` -- what the release workflow runs -- failed.
zip.workspace = true
tar.workspace = true
