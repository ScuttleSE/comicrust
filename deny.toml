# cargo-deny configuration. This file is the dependency licence
# inventory for ADR-041 (comicrust is GPL-2.0-only).
#
# NOT YET A CI GATE. `cargo deny check licenses` does NOT pass today:
# the `exceptions` block below lists three crates whose licences are
# in tension with GPL-2.0-only and which have no decided remedy. The
# check becomes a CI step when that block is empty or when each entry
# carries a recorded resolution. Do NOT move an unresolved crate into
# `allow` to make the check green.
#
# Audit method (2026-09-12): `cargo metadata --all-features`, licence
# field per non-workspace package, then `cargo tree -e normal -p
# cr-app -i <crate>` to confirm the crate really links into the
# shipped binary. Build-only dependencies are out of scope:
# target-lexicon (Apache-2.0 WITH LLVM-exception) is one, and it
# reaches no shipped artifact.

[graph]
all-features = false
no-default-features = false

[licenses]
version = 2

# Permissive and GPL-2.0 compatible. A crate offered as "MIT OR
# Apache-2.0" satisfies GPL-2.0-only through its MIT arm; cargo-deny
# picks a satisfying arm from this list on its own.
allow = [
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "MPL-2.0",
    "CC0-1.0",
    "IJG",
    # The Unicode licence (the ICU crates). Treated as permissive and
    # GPL compatible; 18 crates depend on it and none has an alternative.
    "Unicode-3.0",
    "GPL-2.0-only",
]

# UNRESOLVED — each entry is a recorded risk, not an approval.
# Apache-2.0 imposes patent and indemnity terms that GPL version 2
# does not permit, so these sit in the same open question ADR-041
# records for cr-scrape.
[[licenses.exceptions]]
# Via ureq -> rustls, for the Comic Vine HTTPS client (cr-scrape).
# ring's own tree mixes Apache-2.0 with ISC-licensed, OpenSSL-derived
# code. No cheap remedy: every rustls crypto backend the ecosystem
# offers is Apache-2.0 too.
name = "ring"
allow = ["Apache-2.0", "ISC"]

[[licenses.exceptions]]
# The bundled Mozilla CA set, via ureq. CDLA-Permissive-2.0 is a DATA
# licence and its GPL compatibility is not established here.
# Candidate remedy: rustls-native-certs, which reads the system CA
# store and drops this dependency.
name = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# RESOLVED 2026-09-12: zopfli (Apache-2.0) was removed, not excepted.
# It arrived through the zip crate's "deflate" meta-feature, defined as
#   deflate = ["flate2/rust_backend", "deflate-zopfli", "deflate-flate2"]
# so taking "deflate" pulls zopfli in unconditionally. No comicrust code
# requests zopfli compression -- the writers use Stored and Deflated
# only -- so the workspace takes the two halves it needs instead:
# "deflate-flate2" (a marker) plus "flate2" (the implicit feature of
# zip's optional flate2 dependency, which resolves to the pure-Rust
# rust_backend/miniz_oxide path, exactly as "deflate" did).
# The cr-engine dev-dependency was moved onto the same workspace entry:
# as a bare `zip = "2"` it took zip's DEFAULT features and dragged
# zopfli back in, and -- because dev-dependencies are feature-unified
# into `cargo test --workspace` -- it also HID a broken feature set
# from the test gate while `cargo build -p cr-app` failed.
# Verified: `cargo tree -e normal,dev --workspace -i zopfli` matches no
# package; `cargo build --release --locked -p cr-app` succeeds; the test
# suite is unchanged at 680 passing.
# Side effect: zip's default tail (aes, bzip2, lzma, xz, zstd, time)
# left the lock file too, removing the bzip2-sys, lzma-sys and zstd-sys
# C builds. No test depended on them. Because zopfli left Cargo.lock as
# well (`grep -c zopfli Cargo.lock` = 0), `cargo vendor` no longer
# copies its source into the release source tarball either.

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
