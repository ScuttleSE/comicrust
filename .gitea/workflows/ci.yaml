name: CI

# Runs on every push to main and on manual dispatch. Checks only:
# fmt, clippy, test. Release builds are the separate "Rolling release"
# workflow.
#
# Everything runs inside the comicrust-ci container (see
# .gitea/container/Dockerfile) on the container runner, so the toolchain
# and library versions are pinned by the image, not the host. Rebuild
# the image to update them.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-main
  cancel-in-progress: true

jobs:
  ci:
    name: fmt, clippy, test
    runs-on: docker-runner-amd64
    container:
      image: comicrust-ci:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          cargo --version
          rustc --version

      - name: rustfmt
        run: cargo fmt --check --all

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        # The image ships 7z and the djvulibre tools, so the gated
        # cr-io format tests run here too. PDF stays off (no
        # libpdfium.so in the image).
        env:
          CR_FORMAT_TESTS: "1"
        run: cargo test --workspace

      - name: Check the release binary graph
        # The steps above all build DEV-dependencies, which are
        # feature-unified into the workspace graph and can supply a
        # feature the shipped binary does not get. That masked a broken
        # zip feature set on 2026-09-12: fmt, clippy and 680 tests were
        # green while `cargo build -p cr-app` failed in the release
        # workflow. This step resolves cr-app's graph WITHOUT
        # dev-dependencies, which is what the release workflows build.
        # `--locked` also proves Cargo.lock is current.
        run: cargo check --locked -p cr-app
