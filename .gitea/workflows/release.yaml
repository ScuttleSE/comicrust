name: Rolling release

# Builds the app and republishes the single "rolling" release on every
# push to main (and on manual dispatch). The version is
# <major>.<minor>.<build> where build = total commits on main; bump
# major/minor by editing the Version step below.
#
# The release is marked prerelease and its assets (binary tarball +
# sha256) are replaced on every run. Publishing needs a token with
# write access: if the default GITHUB_TOKEN gets a 403, create a PAT
# (repo scope) and store it as the secret RELEASE_TOKEN — this
# workflow prefers it automatically.
#
# Build image: .gitea/container/Dockerfile (see its header).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-release
  # Never kill a run mid-publish: the release would be left deleted.
  cancel-in-progress: false

jobs:
  release:
    name: build + publish rolling
    runs-on: docker-runner-amd64
    container:
      image: comicrust-ci:latest

    steps:
      - name: Checkout (full history and tags for the version number)
        uses: actions/checkout@v4
        with:
          # fetch-depth 0 brings the tags too. The version below is
          # derived from the nearest stable tag, so a shallow checkout
          # would silently produce the wrong number.
          fetch-depth: 0

      - name: Version
        id: version
        # <major>.<minor>.<commits since the newest stable tag>
        # (ADR-043). The counter RESTARTS at every stable tag: after
        # v0.1.0 the builds are 0.1.1, 0.1.2, ...; after v0.2.0 they are
        # 0.2.1, 0.2.2, ... The major and minor come from the tag, so no
        # hand bump is needed here.
        #
        # The tag filter is a STRICT regex, not a git glob. `git
        # describe --match` takes an fnmatch pattern, in which
        # `v[0-9]*.[0-9]*.[0-9]*` also matches v0.1.0-rc1 and similar,
        # because `[0-9]*` is "a digit then anything". Listing the tags
        # reachable from HEAD and filtering with grep -E excludes both
        # the moving "rolling" tag and any prerelease suffix. `sort -V`
        # then takes the HIGHEST reachable stable version, so the number
        # can never fall below a release that is already an ancestor.
        #
        # Tags below v0.1.0 are EXCLUDED. v0.0.280 and v0.0.283 were cut
        # under the old ADR-020 scheme, in which the patch field was the
        # TOTAL commit count, not a per-release counter. Treating one of
        # them as a counter origin would restart the numbering far below
        # what has already shipped.
        run: |
          set -euo pipefail
          last="$(git tag -l --merged HEAD \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | grep -vE '^v0\.0\.' \
              | sort -V | tail -n1 || true)"
          if [ -z "$last" ]; then
              # No stable tag yet. Fall back to counting everything
              # under 0.0, which stays below any future 0.1.0 tag.
              version="0.0.$(git rev-list --count HEAD)"
              echo "no stable tag found; falling back to $version"
          else
              count="$(git rev-list --count "${last}..HEAD")"
              if [ "$count" -eq 0 ]; then
                  echo "HEAD is exactly $last: a rolling build here would" >&2
                  echo "collide with the stable release. Nothing to do." >&2
                  exit 1
              fi
              base="${last#v}"
              version="${base%.*}.${count}"
              echo "newest stable tag: $last ($count commits since)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "rolling version: $version"

      - name: Build
        env:
          # MUST be set HERE, not only on Package: cr-ui/build.rs reads
          # VERSION at COMPILE time to stamp the About dialog.
          VERSION: ${{ steps.version.outputs.version }}
        run: cargo build --release --locked -p cr-app

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          asset="comicrust-${VERSION}-linux-amd64.tar.gz"
          mkdir -p dist/assets
          cp target/release/cr-app dist/comicrust
          # Every asset kind the app looks up at runtime. Keep this list
          # in step with packaging/deb/build.sh and packaging/arch/PKGBUILD.
          for kind in papers backgrounds icons scan pages; do
              cp -r "crates/cr-ui/assets/$kind" "dist/assets/$kind"
          done
          tar -czf "$asset" -C dist comicrust assets
          sha256sum "$asset" > "${asset}.sha256"
          echo "packaged: $asset"

      - name: Publish
        env:
          # Prefer a PAT secret; fall back to the default token.
          TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .gitea/publish_release.sh rolling "$VERSION" true true

      - name: Publish to GitHub mirror
        env:
          # GitHub PAT with Contents read/write on the mirror repo.
          # Unset = the step skips with a notice.
          GH_TOKEN: ${{ secrets.MIRROR_RELEASE_TOKEN }}
          GH_REPO: ScuttleSE/comicrust
          SHA: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .gitea/publish_github_release.sh rolling "$VERSION" true true
